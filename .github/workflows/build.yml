name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Extrair zip
        run: |
          rm -rf AutoClickFN
          unzip -q -o AutoClickFN.zip
          grep -n "versionName\|applicationId" AutoClickFN/app/build.gradle
      - name: Compilar
        run: |
          cd AutoClickFN
          gradle assembleDebug assembleRelease --continue --stacktrace 2>&1 | tee ../build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NexMacro-apk
          path: |
            AutoClickFN/app/build/outputs/apk/**/*.apk
            build.log
