name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Conferir arquivos
        run: |
          ls -la
          rm -rf AutoClickFN
          unzip -q -o AutoClickFN.zip
          grep -n "versionName\|applicationId" AutoClickFN/app/build.gradle
      - run: cd AutoClickFN && gradle assembleRelease assembleDebug --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NexMacro-apk
          path: AutoClickFN/app/build/outputs/apk/**/*.apk
