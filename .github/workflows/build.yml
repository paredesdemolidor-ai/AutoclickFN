name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: unzip -q AutoClickFN.zip
      - run: cd AutoClickFN && gradle assembleDebug assembleRelease --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutoClickFN-apk
          path: |
            AutoClickFN/app/build/outputs/apk/release/app-release.apk
            AutoClickFN/app/build/outputs/apk/debug/app-debug.apk
